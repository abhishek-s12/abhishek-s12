<svg width="420" height="34" viewBox="0 0 420 34" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff00c8"/>
      <stop offset="100%" stop-color="#00fff5"/>
    </linearGradient>
    <style>
      text { font-family: 'Courier New', monospace; font-size: 11px; fill: #9a9a9a; letter-spacing: 1px; }
      .track { fill: none; stroke: #ff00c8; stroke-opacity: 0.25; }
      .fill  { fill: url(#loadGrad); animation: load 2.8s ease-in-out infinite; transform-origin: 0px 0px; }
      @keyframes load {
        0%   { transform: scaleX(0); }
        60%  { transform: scaleX(1); }
        100% { transform: scaleX(1); }
      }
    </style>
  </defs>
  <text x="0" y="10">SKILLS.LOADED :: 100%</text>
  <rect x="0" y="16" width="420" height="8" rx="4" class="track" stroke-width="1"/>
  <rect x="0" y="16" width="420" height="8" rx="4" class="fill"/>
</svg>
