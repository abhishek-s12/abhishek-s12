<svg width="100%" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scanGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d0221" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00fff5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ff00c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d0221" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff00c8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .beam {
        animation: sweepDown 3s linear infinite;
      }
      @keyframes sweepDown {
        0%   { transform: translateY(-60px); }
        100% { transform: translateY(180px); }
      }
    </style>
  </defs>

  <rect width="1200" height="180" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#ff00c8" fill-opacity="0.2"/>
  <rect x="0" y="179" width="1200" height="1" fill="#00fff5" fill-opacity="0.2"/>

  <rect class="beam" x="0" y="0" width="1200" height="60" fill="url(#scanGradV)"/>
</svg>
