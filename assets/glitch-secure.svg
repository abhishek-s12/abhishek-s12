<svg width="100%" height="46" viewBox="0 0 900 46" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 700; letter-spacing: 5px; }
      .base   { fill: #e6e6e6; }
      .cyan   { fill: #00fff5; opacity: 0.85; animation: glitchCyan 3.6s infinite steps(1); }
      .pink   { fill: #ff00c8; opacity: 0.85; animation: glitchPink 3.6s infinite steps(1); }
      @keyframes glitchCyan {
        0%, 88%, 100% { transform: translate(0px, 0px); opacity: 0; }
        89%           { transform: translate(-3px, 0px); opacity: 0.8; }
        92%           { transform: translate(2px, -1px); opacity: 0.7; }
        95%           { transform: translate(-2px, 1px); opacity: 0.5; }
      }
      @keyframes glitchPink {
        0%, 86%, 100% { transform: translate(0px, 0px); opacity: 0; }
        87%           { transform: translate(3px, 0px); opacity: 0.8; }
        90%           { transform: translate(-2px, 1px); opacity: 0.7; }
        94%           { transform: translate(2px, -1px); opacity: 0.5; }
      }
    </style>
  </defs>
  <text x="50%" y="30" text-anchor="middle" class="pink">CONNECTION :: SECURE</text>
  <text x="50%" y="30" text-anchor="middle" class="cyan">CONNECTION :: SECURE</text>
  <text x="50%" y="30" text-anchor="middle" class="base">CONNECTION :: SECURE</text>
</svg>
