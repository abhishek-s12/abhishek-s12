<svg width="100%" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d0221"/>
      <stop offset="30%"  stop-color="#3a0a5a"/>
      <stop offset="60%"  stop-color="#ff00c8"/>
      <stop offset="100%" stop-color="#00fff5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: 'Trebuchet MS', Verdana, sans-serif; }
      .title { font-size: 52px; font-weight: 700; fill: #ffffff; letter-spacing: 3px; }
      .desc  { font-size: 17px; fill: #00fff5; letter-spacing: 2px; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      .flicker { animation: flicker 5s ease-in-out infinite; }
      @keyframes flicker {
        0%, 92%, 100% { opacity: 1; }
        93%            { opacity: 0.6; }
        95%            { opacity: 1; }
        96%            { opacity: 0.7; }
      }
    </style>
  </defs>

  <rect width="1200" height="240" fill="url(#heroBg)"/>
  <rect width="1200" height="240" fill="url(#glow)" class="pulse"/>

  <!-- wavy bottom edge -->
  <path d="M0,220 C150,200 300,240 450,220 C600,200 750,240 900,220 C1050,200 1150,220 1200,215 L1200,240 L0,240 Z"
        fill="#0d0221" fill-opacity="0.55"/>

  <text x="50%" y="120" text-anchor="middle" class="title flicker">ABHISHEK KUMAR</text>
  <text x="50%" y="158" text-anchor="middle" class="desc">&lt; AI ENGINEER // SYSTEM BUILDER &gt;</text>
</svg>
