<svg width="100%" height="34" viewBox="0 0 1200 34" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d0221" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00fff5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ff00c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d0221" stop-opacity="0"/>
    </linearGradient>
    <style>
      .baseline { stroke: #ff00c8; stroke-opacity: 0.25; }
      .beam {
        animation: sweep 2.6s linear infinite;
      }
      @keyframes sweep {
        0%   { transform: translateX(-420px); }
        100% { transform: translateX(1200px); }
      }
    </style>
  </defs>

  <line x1="0" y1="17" x2="1200" y2="17" class="baseline" stroke-width="1"/>

  <rect class="beam" x="0" y="0" width="420" height="34" fill="url(#scanGrad)"/>
</svg>
